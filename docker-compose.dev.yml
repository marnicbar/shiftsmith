# Development stack: PostgreSQL + the backend + the Vite dev server, each in its
# own container with hot reload. The frontend dev server proxies /api/* to the
# backend. For a single production image (UI + API together), use the default
# docker-compose.yml instead.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Then open http://localhost:5173 (Swagger UI: http://localhost:8080/q/swagger-ui).

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=shiftsmith
      - POSTGRES_PASSWORD=shiftsmith
      - POSTGRES_DB=shiftsmith
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftsmith"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/shiftsmith
      - POSTGRES_USER=shiftsmith
      - POSTGRES_PASSWORD=shiftsmith
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      # The Vite dev server proxies /api/* to the backend container.
      - VITE_API_PROXY=http://backend:8080
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  pgdata:
