# ShiftSmith (UI + API, port 8080) plus PostgreSQL. See README.md.
#
# Replace every <placeholder> below, then:
#
#   docker compose up -d
#
# Already run PostgreSQL yourself? Use docker-compose.external-db.yml.

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=shiftsmith
      - POSTGRES_PASSWORD=<choose_a_database_password>
      - POSTGRES_DB=shiftsmith
    volumes:
      # A host directory rather than a named volume, so backups are easy to find
      # and `docker compose down -v` can't wipe them.
      - ./data/postgres:/var/lib/postgresql/data
    # No `ports:` — only the app needs the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftsmith"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    # Pinned, so a restart never quietly upgrades you.
    image: ghcr.io/marnicbar/shiftsmith:0.1.0
    ports:
      # Loopback: this is plain HTTP, so it belongs behind a TLS proxy. Use
      # 0.0.0.0:8080:8080 to expose it directly on a trusted network.
      - "127.0.0.1:8080:8080"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/shiftsmith
      - POSTGRES_USER=shiftsmith
      # Same password as the db service above.
      - POSTGRES_PASSWORD=<choose_a_database_password>
      # The admin account seeded on a fresh database. Without a password it is
      # blocked from every protected endpoint until you rotate it.
      - SHIFTSMITH_ADMIN_USERNAME=admin
      - SHIFTSMITH_ADMIN_PASSWORD=<choose_an_admin_password>
      # Your business timezone, e.g. Europe/Berlin: the schedule model is
      # zone-less, so this decides when "today" and the solve horizon roll over.
      - TZ=<your_timezone>
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # The solver burns CPU between edits; cap it so it can't starve PostgreSQL.
    # The JVM sizes its heap from mem_limit — raise both for large rosters.
    mem_limit: 1g
    cpus: 2.0
