# ShiftSmith (UI + API, port 8080) plus PostgreSQL. See README.md.
#
#   cp .env.example .env      # the passwords have no defaults
#   docker compose up -d
#
# Already run PostgreSQL yourself? Use docker-compose.external-db.yml.

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-shiftsmith}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-shiftsmith}
    volumes:
      # A host directory rather than a named volume, so backups are easy to find
      # and `docker compose down -v` can't wipe them.
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    # No `ports:` — only the app needs the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shiftsmith}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    # Pinned, so a restart never quietly upgrades you.
    image: ghcr.io/marnicbar/shiftsmith:${SHIFTSMITH_VERSION:-0.1.0}
    ports:
      # Loopback: this is plain HTTP, so it belongs behind a TLS proxy. Set
      # SHIFTSMITH_BIND=0.0.0.0 to expose it directly on a trusted network.
      - "${SHIFTSMITH_BIND:-127.0.0.1}:${SHIFTSMITH_PORT:-8080}:8080"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-shiftsmith}
      - POSTGRES_USER=${POSTGRES_USER:-shiftsmith}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # The admin account seeded on a fresh database. Without a password it is
      # blocked from every protected endpoint until you rotate it.
      - SHIFTSMITH_ADMIN_USERNAME=${SHIFTSMITH_ADMIN_USERNAME:-admin}
      - SHIFTSMITH_ADMIN_PASSWORD=${SHIFTSMITH_ADMIN_PASSWORD:?set SHIFTSMITH_ADMIN_PASSWORD in .env}
      # Your business timezone: the schedule model is zone-less, so this decides
      # when "today" and the solve horizon roll over. Defaults to UTC, not the host.
      - TZ=${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # The solver burns CPU between edits; cap it so it can't starve PostgreSQL.
    # The JVM sizes its heap from mem_limit — raise both for large rosters.
    mem_limit: ${SHIFTSMITH_MEM_LIMIT:-1g}
    cpus: ${SHIFTSMITH_CPUS:-2.0}
