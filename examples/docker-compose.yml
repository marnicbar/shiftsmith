# ShiftSmith — production deployment (published image + PostgreSQL).
#
# Runs the released all-in-one image (React UI + Quarkus API on port 8080)
# against a PostgreSQL container. Nothing is built from source: pull, configure,
# run. See README.md in this directory for the full deployment guide.
#
#   cp .env.example .env      # then edit it — the passwords have no defaults
#   docker compose up -d
#
# To point at a PostgreSQL you already operate, use
# docker-compose.external-db.yml instead.

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-shiftsmith}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-shiftsmith}
    volumes:
      # A host directory (default ./data/postgres) rather than a named volume, so
      # the data is easy to find, back up, and does not vanish with
      # `docker compose down -v`. Created on first run.
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    # Deliberately not published to the host: only the app needs the database,
    # over the internal compose network. Take backups with
    # `docker compose exec db pg_dump ...` (see README.md).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shiftsmith}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    # Pin a version rather than tracking `latest`, so a restart can never pull a
    # different release out from under you. Upgrades are then a deliberate bump
    # of SHIFTSMITH_VERSION (see README.md → Upgrading).
    image: ghcr.io/marnicbar/shiftsmith:${SHIFTSMITH_VERSION:-0.1.0}
    ports:
      # Bound to loopback by default: the app speaks plain HTTP and session
      # tokens live in the browser, so it belongs behind a TLS-terminating
      # reverse proxy. Set SHIFTSMITH_BIND=0.0.0.0 to expose it directly (only
      # on a trusted network).
      - "${SHIFTSMITH_BIND:-127.0.0.1}:${SHIFTSMITH_PORT:-8080}:8080"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-shiftsmith}
      - POSTGRES_USER=${POSTGRES_USER:-shiftsmith}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Credentials of the admin account seeded on a fresh database. Set the
      # password before the first boot so the instance is never reachable on the
      # well-known default; without it the account is seeded but blocked from
      # every protected endpoint until the password is rotated.
      - SHIFTSMITH_ADMIN_USERNAME=${SHIFTSMITH_ADMIN_USERNAME:-admin}
      - SHIFTSMITH_ADMIN_PASSWORD=${SHIFTSMITH_ADMIN_PASSWORD:?set SHIFTSMITH_ADMIN_PASSWORD in .env}
      # The schedule model is zone-less: "today", the horizon roll-over and shift
      # wall-clock times all use the app's default timezone. Pin it to your
      # business timezone so the horizon rolls at local midnight; it defaults to
      # UTC rather than the host's zone.
      - TZ=${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # The Timefold solver deliberately burns CPU between edits, so cap the app to
    # stop it starving PostgreSQL (or the host) on a shared box. The JVM is
    # container-aware and sizes its heap from this limit. Raise mem_limit for
    # very large rosters.
    mem_limit: ${SHIFTSMITH_MEM_LIMIT:-1g}
    cpus: ${SHIFTSMITH_CPUS:-2.0}
