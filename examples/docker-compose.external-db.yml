# ShiftSmith against a PostgreSQL 14+ you already operate. Point it at an empty
# database with a role that may create tables — Flyway migrates it at startup.
#
# Replace every <placeholder> below, then:
#
#   docker compose -f docker-compose.external-db.yml up -d

services:
  app:
    image: ghcr.io/marnicbar/shiftsmith:0.1.0
    ports:
      # Loopback — put a TLS proxy in front.
      - "127.0.0.1:8080:8080"
    environment:
      # Add ?sslmode=require if the server is remote.
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://<your_db_host>:5432/shiftsmith
      - POSTGRES_USER=<your_db_user>
      - POSTGRES_PASSWORD=<your_db_password>
      - SHIFTSMITH_ADMIN_USERNAME=admin
      - SHIFTSMITH_ADMIN_PASSWORD=<choose_an_admin_password>
      - TZ=<your_timezone>
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
