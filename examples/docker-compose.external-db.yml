# ShiftSmith against a PostgreSQL 14+ you already operate. Point it at an empty
# database with a role that may create tables — Flyway migrates it at startup.
#
#   cp .env.example .env      # set POSTGRES_JDBC_URL, user and password
#   docker compose -f docker-compose.external-db.yml up -d

services:
  app:
    image: ghcr.io/marnicbar/shiftsmith:${SHIFTSMITH_VERSION:-0.1.0}
    ports:
      # Loopback — put a TLS proxy in front.
      - "${SHIFTSMITH_BIND:-127.0.0.1}:${SHIFTSMITH_PORT:-8080}:8080"
    environment:
      # jdbc:postgresql://host:5432/shiftsmith — add ?sslmode=require if remote.
      - QUARKUS_DATASOURCE_JDBC_URL=${POSTGRES_JDBC_URL:?set POSTGRES_JDBC_URL in .env}
      - POSTGRES_USER=${POSTGRES_USER:?set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - SHIFTSMITH_ADMIN_USERNAME=${SHIFTSMITH_ADMIN_USERNAME:-admin}
      - SHIFTSMITH_ADMIN_PASSWORD=${SHIFTSMITH_ADMIN_PASSWORD:?set SHIFTSMITH_ADMIN_PASSWORD in .env}
      - TZ=${TZ:-UTC}
    restart: unless-stopped
    mem_limit: ${SHIFTSMITH_MEM_LIMIT:-1g}
    cpus: ${SHIFTSMITH_CPUS:-2.0}
