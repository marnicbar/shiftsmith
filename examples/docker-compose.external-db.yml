# ShiftSmith — production deployment against a PostgreSQL you already operate
# (a managed service, a shared cluster, another host).
#
# Same released image as docker-compose.yml, minus the database container. The
# app needs an empty database and a role that may create tables in it: Flyway
# runs the schema migrations at startup.
#
#   cp .env.example .env      # then set POSTGRES_JDBC_URL, user and password
#   docker compose -f docker-compose.external-db.yml up -d
#
# PostgreSQL 14 or newer is required.

services:
  app:
    image: ghcr.io/marnicbar/shiftsmith:${SHIFTSMITH_VERSION:-0.1.0}
    ports:
      # Loopback by default — put a TLS-terminating reverse proxy in front.
      - "${SHIFTSMITH_BIND:-127.0.0.1}:${SHIFTSMITH_PORT:-8080}:8080"
    environment:
      # e.g. jdbc:postgresql://db.internal:5432/shiftsmith
      # Append ?sslmode=require (or verify-full) when the server is remote.
      - QUARKUS_DATASOURCE_JDBC_URL=${POSTGRES_JDBC_URL:?set POSTGRES_JDBC_URL in .env}
      - POSTGRES_USER=${POSTGRES_USER:?set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - SHIFTSMITH_ADMIN_USERNAME=${SHIFTSMITH_ADMIN_USERNAME:-admin}
      - SHIFTSMITH_ADMIN_PASSWORD=${SHIFTSMITH_ADMIN_PASSWORD:?set SHIFTSMITH_ADMIN_PASSWORD in .env}
      - TZ=${TZ:-UTC}
    restart: unless-stopped
    mem_limit: ${SHIFTSMITH_MEM_LIMIT:-1g}
    cpus: ${SHIFTSMITH_CPUS:-2.0}
