name: CI

# Pull requests are validated via the `pull_request` event; pushes to `main` are
# validated via `push`. Restricting `push` to `main` avoids running every job twice
# on PR branches (where a push also triggers `pull_request: synchronize`).
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the checkout; nothing needs write scope.
permissions:
  contents: read

# Cancel superseded runs for the same PR/branch to save CI minutes. Keyed on the
# head branch (PR source) so re-pushes cancel the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Quarkus + Timefold)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ubuntu-latest runners have a running Docker daemon, so the docker-activated
      # Maven profile kicks in and `verify` also runs the @QuarkusTest *IT
      # (REST + Dev Services PostgreSQL round-trip). Without Docker this degrades
      # gracefully to the unit/solver suite.
      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
