name: Publish image

# Build the all-in-one image and push it to the GitHub Container Registry on
# version tags (e.g. `v1.2.3`). Also runnable on demand from the Actions tab —
# but the publish step only runs for a `v*` tag, so a manual run from a feature
# branch can't push an image or move `latest`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege by default; the publish job widens this to packages: write.
permissions:
  contents: read

jobs:
  # The image is only pushed if both suites pass for this exact commit (issue #35).
  test-backend:
    name: Test backend (Quarkus + Timefold)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 26
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # ubuntu-latest has a running Docker daemon, so `verify` also runs the
      # @QuarkusTest *IT (REST + Dev Services PostgreSQL round-trip).
      - name: Build and test
        run: mvn -B --no-transfer-progress verify

  test-frontend:
    name: Test frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build

  image:
    name: Build and push (GHCR)
    needs: [test-backend, test-frontend]
    # Publish only for a version tag, never a branch dispatch — so an image (and
    # `latest`) can never be produced from an arbitrary, unreleased ref.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The runtime stage (apt + the Typst tarball) is built once per target
      # architecture, so cross-building arm64 on an amd64 runner needs emulation.
      # The npm/Maven stages are pinned to $BUILDPLATFORM and stay native.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives image tags/labels: the full semver, major.minor, and `latest`.
      # `latest` is gated on a version tag, so re-running from a branch never moves it.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
