# Continuous solving: keep improving until the solution is steady.
# The solver pauses (terminates the job) once no better solution has been
# found for `unimproved-spent-limit`, or after the hard `spent-limit` ceiling.
quarkus.timefold.solver.termination.spent-limit=120s
quarkus.timefold.solver.termination.unimproved-spent-limit=8s

# Swagger UI / OpenAPI are developer aids only. Quarkus serves Swagger UI in dev
# anyway; never force it into the packaged app. In prod, also disable the OpenAPI
# document endpoint so neither /q/swagger-ui nor /q/openapi is reachable (they sit
# outside JAX-RS, so AuthFilter doesn't guard them). See issue #36.
%dev.quarkus.swagger-ui.always-include=true
%prod.quarkus.smallrye-openapi.enabled=false

# --- PDF export (Typst) ------------------------------------------------------
# The calendar PDF export shells out to the `typst` binary (installed in the
# container image). Point this at another path if it is not on PATH; the export
# endpoint answers 503 with a clear message when the binary is missing, so the
# rest of the app runs fine without it.
shiftsmith.typst.bin=typst
shiftsmith.typst.timeout-seconds=30

# --- Initial admin account ---------------------------------------------------
# On a fresh database one admin account is seeded. In production, set the initial
# password via SHIFTSMITH_ADMIN_PASSWORD (and optionally SHIFTSMITH_ADMIN_USERNAME);
# when it is left unset the account falls back to a well-known default but is
# blocked from every protected endpoint until the password is rotated. Dev mode
# uses a throwaway database on each restart, so we provision the password there to
# avoid a forced password change on every boot.
%dev.shiftsmith.admin.password=shiftsmith

# --- Database (PostgreSQL, normalized schema — issue #47) --------------------
# Flyway owns the schema (versioned migrations under db/migration); Hibernate only
# validates that the entities match it and never issues DDL itself. baseline-on-migrate
# lets Flyway adopt a pre-existing (Hibernate-created) database by marking it at the
# baseline version, after which V1+ run idempotently (CREATE TABLE IF NOT EXISTS).
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
# Serialize JSONB columns with the standard Jackson facilities (ISO-8601 dates).
quarkus.hibernate-orm.mapping.format.global=ignore

# Dev mode (`mvn quarkus:dev`): Quarkus Dev Services auto-starts a throwaway
# PostgreSQL container — no connection settings needed (requires Docker).
#
# Packaged/prod mode: connect to the `db` service from docker-compose. Override
# any of these with the standard QUARKUS_DATASOURCE_* environment variables.
%prod.quarkus.datasource.username=${POSTGRES_USER:shiftsmith}
# No default: prod must be given POSTGRES_PASSWORD explicitly. Without it Quarkus
# fails fast at startup rather than silently inheriting the well-known default
# (which would be a real password the moment the DB is reachable). See issue #36.
%prod.quarkus.datasource.password=${POSTGRES_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://db:5432/shiftsmith}
