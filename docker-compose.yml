# Production deployment.
#
# The all-in-one ShiftSmith image (React UI + Quarkus API on port 8080) plus a
# PostgreSQL database. The database is intentionally NOT baked into the image —
# point the app at any PostgreSQL via the QUARKUS_DATASOURCE_* environment.
#
#   docker compose up -d --build      # build the image locally and run
#
# To run a published image instead of building locally, drop the `build:` block
# and keep just the `image:` line (optionally pinning a version tag):
#
#   image: ghcr.io/marnicbar/shiftsmith:latest
#
# Credentials default to "shiftsmith"; override them (and the published image
# tag) via a .env file or the shell environment before going to production.
#
# For the hot-reload development stack (separate Vite dev server + backend),
# see docker-compose.dev.yml.

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-shiftsmith}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-shiftsmith}
      - POSTGRES_DB=${POSTGRES_DB:-shiftsmith}
    volumes:
      # Database files live in a host directory (default ./data/postgres) so they
      # are easy to back up and survive `docker compose down -v`. Override the
      # location with POSTGRES_DATA_DIR. The directory is created on first run.
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    # Not published to the host: only the app needs to reach the database, over
    # the internal compose network. Add a `ports:` mapping if you need direct
    # access for backups/inspection.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shiftsmith}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    image: ghcr.io/marnicbar/shiftsmith:latest
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-shiftsmith}
      - POSTGRES_USER=${POSTGRES_USER:-shiftsmith}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-shiftsmith}
      # Credentials of the admin account seeded on a fresh database. Set
      # SHIFTSMITH_ADMIN_PASSWORD before the first boot so the instance is never
      # reachable on the well-known default; left empty, the account is seeded with
      # it but blocked from every protected endpoint until it is rotated (issue #36).
      - SHIFTSMITH_ADMIN_USERNAME=${SHIFTSMITH_ADMIN_USERNAME:-admin}
      - SHIFTSMITH_ADMIN_PASSWORD=${SHIFTSMITH_ADMIN_PASSWORD:-}
      # The schedule model is zone-less: "today", the horizon roll-over and shift
      # wall-clock times all use the app's default timezone. Pin it explicitly to
      # your business timezone (e.g. Europe/Berlin) so the horizon rolls at local
      # midnight; defaults to UTC rather than the host's zone (issue #40).
      - TZ=${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # The Timefold solver deliberately burns CPU between edits, so cap the app's
    # resources to stop it starving PostgreSQL (or the host) on a shared box. The
    # JVM is container-aware and sizes its heap from this limit (issue #35). Raise
    # mem_limit for very large rosters.
    mem_limit: 1g
    cpus: 2.0
